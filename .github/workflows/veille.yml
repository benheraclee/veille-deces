name: Veille décès

on:
  schedule:
    - cron: "10 5 * * *"      # tous les jours 7h10 (heure d'été Genève)
  workflow_dispatch:
    inputs:
      jours:
        description: "Nombre de jours à analyser"
        default: "3"
      diagnostic:
        description: "Diagnostic (1 = oui)"
        default: "0"

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fra tesseract-ocr-deu
      - name: Dépendances
        run: pip install -q -r robot/requirements.txt
      - name: Lancer la veille
        env:
          SUPABASE_URL: https://wpnsxibjsstnvroovehm.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JOURS: ${{ github.event.inputs.jours || '3' }}
          DIAGNOSTIC: ${{ github.event.inputs.diagnostic || '0' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python robot/veille.py
